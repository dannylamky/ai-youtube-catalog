.empty { color:var(--muted); padding:24px 0; }

<script>
(function () {
  const INITIAL = 3;
  const channels = JSON.parse(document.getElementById('catalog-data').textContent);
  const filtersEl = document.getElementById('filters');
  const mainEl = document.getElementById('main');
  const metaEl = document.getElementById('meta');

  function toHkt(iso) {
    try {
      const d = new Date(iso);
      const parts = new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Hong_Kong', year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit', hour12:false
      }).formatToParts(d);
      const get = t => parts.find(p => p.type === t).value;
      return get('year') + '-' + get('month') + '-' + get('day') + ' ' + get('hour') + ':' + get('minute') + ' (Asia/Hong_Kong)';
    } catch (e) { return iso || ''; }
  }

  // null = show all; otherwise single channel handle
  let selected = null;
  const expanded = new Set();

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderFilters() {
    filtersEl.innerHTML = '';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = '頻道：';
    filtersEl.appendChild(label);

    const allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'chip' + (selected === null ? ' active' : '');
    allBtn.textContent = '全部';
    allBtn.setAttribute('aria-pressed', selected === null ? 'true' : 'false');
    allBtn.addEventListener('click', () => {
      selected = null;
      paint();
    });
    filtersEl.appendChild(allBtn);

    channels.forEach(ch => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip' + (selected === ch.handle ? ' active' : '');
      btn.textContent = ch.handle;
      btn.setAttribute('aria-pressed', selected === ch.handle ? 'true' : 'false');
      btn.addEventListener('click', () => {
        selected = (selected === ch.handle) ? null : ch.handle;
        paint();
      });
      filtersEl.appendChild(btn);
    });
  }

  function videoCard(v) {
    const thumb = v.thumbnail_hq || v.thumbnail_maxres || '';
    return '<article class="card">' +
      '<a class="thumb" href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
      '<img src="' + esc(thumb) + '" alt="" loading="lazy"></a>' +
      '<div class="body">' +
      '<a class="title" href="' + esc(v.url) + '" target="_blank" rel="noopener">' + esc(v.title) + '</a>' +
      '<div class="date">' + esc(toHkt(v.published)) + '</div>' +
      (v.topic ? '<div class="topic">' + esc(v.topic) + '</div>' : '') +
      '</div></article>';
  }

  function buildChannelSection(ch) {
    const id = (ch.handle || '').replace(/^@/, '');
    const vids = ch.videos || [];
    const isExp = expanded.has(ch.handle);
    const show = isExp ? vids : vids.slice(0, INITIAL);
    const section = document.createElement('section');
    section.className = 'channel';
    section.id = id;
    section.innerHTML =
      '<div class="channel-head"><h2>' + esc(ch.channel_name || id) +
      ' <span class="handle">' + esc(ch.handle) + '</span></h2></div>' +
      '<p class="ch-url"><a href="' + esc(ch.channel_url) + '" target="_blank" rel="noopener">' + esc(ch.channel_url) +
      '</a> · ' + vids.length + ' videos in feed</p>' +
      '<div class="grid">' + show.map(videoCard).join('') + '</div>';
    if (vids.length > INITIAL) {
      const row = document.createElement('div');
      row.className = 'more-row';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-more';
      btn.textContent = isExp ? '收起（只顯示最近 3 條）' : ('睇更多（仲有 ' + (vids.length - INITIAL) + ' 條）');
      btn.addEventListener('click', () => {
        if (expanded.has(ch.handle)) expanded.delete(ch.handle);
        else expanded.add(ch.handle);
        paint();
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      row.appendChild(btn);
      section.appendChild(row);
    }
    return section;
  }

  function renderChannels() {
    mainEl.innerHTML = '';
    const visible = selected === null
      ? channels.slice()
      : channels.filter(c => c.handle === selected);
    if (!visible.length) {
      mainEl.innerHTML = '<p class="empty">未選任何頻道——撳上面嘅 chip 揀頻道。</p>';
      return;
    }
    for (let i = 0; i < visible.length; i += 2) {
      const pair = document.createElement('div');
      pair.className = 'pair-row';
      pair.appendChild(buildChannelSection(visible[i]));
      if (visible[i + 1]) pair.appendChild(buildChannelSection(visible[i + 1]));
      mainEl.appendChild(pair);
    }
  }

  function paint() {
    const totalVids = channels.reduce((n, c) => n + (c.videos || []).length, 0);
    metaEl.textContent = channels.length + ' channels · 每行兩個頻道各 3 張縮圖 · 頻道單選 · 共 ' +
      totalVids + ' 條 · 時間 Asia/Hong_Kong';
    renderFilters();
    renderChannels();
  }

  paint();
})();
</script>
